<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Canonical is the whole point of this file: it tells Google the new URL
         is the real home of this content, so the ranking this page has built
         for "Udhayan mcet", "Udhayan portfolio" etc. consolidates there rather
         than being split across two competing pages. -->
    <link rel="canonical" href="https://udhayan-portfolio.netlify.app/" />

    <!-- No-JS fallback. A 0-second meta refresh is treated by Google as
         equivalent to a 301, which is the closest GitHub Pages can get — it is
         a static host with no server config, so a real 301 is not available. -->
    <meta http-equiv="refresh" content="0; url=https://udhayan-portfolio.netlify.app/" />

    <!-- KEEP THIS. Removing it un-verifies the property in Google Search
         Console and you lose the history for this URL. -->
    <meta name="google-site-verification" content="scjnpg7G8S3-f4W7EcbvgdRB73VVS4DbBVCEFtpcBCY" />

    <title>Udhayan S — Software Engineer Portfolio</title>
    <meta
      name="description"
      content="Udhayan S — Software Engineer and product builder in Chennai. This portfolio has moved to udhayan-portfolio.netlify.app."
    />
    <meta name="author" content="Udhayan S" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:title" content="Udhayan S — Software Engineer Portfolio" />
    <meta property="og:description" content="This portfolio has moved. Redirecting to the current site." />
    <meta property="og:url" content="https://udhayan-portfolio.netlify.app/" />
    <meta property="og:type" content="website" />

    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b0b0b;
        color: #f4f1ec;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .mark {
        font-family: 'Arial Narrow', Impact, sans-serif;
        font-size: 13px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #c6f32b;
        margin: 0 0 20px;
      }
      h1 {
        margin: 0 0 14px;
        font-family: 'Arial Narrow', Impact, sans-serif;
        font-size: clamp(34px, 8vw, 68px);
        line-height: 0.95;
        letter-spacing: -0.01em;
        text-transform: uppercase;
        font-weight: 400;
      }
      p { margin: 0 0 26px; color: #a5a19b; font-size: 15px; line-height: 1.6; }
      a.cta {
        display: inline-block;
        padding: 13px 26px;
        background: #c6f32b;
        color: #0b0b0b;
        border: 2px solid #0b0b0b;
        box-shadow: 4px 4px 0 #f4f1ec;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
      }
      .url { margin-top: 22px; font-size: 12px; color: #6b6862; word-break: break-all; }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">Udhayan S</p>
      <h1>This portfolio<br />has moved.</h1>
      <p>Taking you to the current site&hellip;</p>
      <a class="cta" href="https://udhayan-portfolio.netlify.app/">Go there now &rarr;</a>
      <p class="url">udhayan-portfolio.netlify.app</p>
    </main>

    <script>
      (function () {
        var TARGET = 'https://udhayan-portfolio.netlify.app/';

        // The old page was one long scroller with #anchors; the new site uses
        // different ids. Map them so an existing bookmark or backlink lands on
        // the equivalent section instead of dumping everyone at the top.
        var SECTIONS = {
          '#home': '',
          '#about': '#about',
          '#resume': '#experience',
          '#service': '#services',
          '#blog': '#work',
          '#portfolio': '#achievements',
          '#contact': '#contact'
        };

        var hash = window.location.hash.toLowerCase();
        var suffix = Object.prototype.hasOwnProperty.call(SECTIONS, hash) ? SECTIONS[hash] : '';

        // replace() rather than assign(): otherwise Back returns here and
        // immediately redirects again, trapping the visitor.
        window.location.replace(TARGET + suffix);
      })();
    </script>
  </body>
</html>
